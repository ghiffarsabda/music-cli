[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "music-cli"
version = "0.1.0"
description = "A sleek CLI tool to stream music directly from YouTube Music in your terminal."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Ghiffar Sabda" }
]
dependencies = [
    "ytmusicapi>=1.12.0",
    "yt-dlp>=2024.4.9",
    "rich>=13.0.0",
    "secretstorage>=3.3.0",
]

[project.scripts]
music = "music.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["music*"]
